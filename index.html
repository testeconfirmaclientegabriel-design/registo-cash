<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despesas — Registo Mensal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b201e;
    --paper:#f6f4ee;
    --paper-dim:#ece8dd;
    --teal:#2f6f5e;
    --teal-dark:#204c40;
    --amber:#d9a441;
    --red:#b3452f;
    --line:#c9c3b2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(47,111,94,0.25), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(217,164,65,0.12), transparent 45%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .receipt{
    width:100%;
    max-width:420px;
    background:var(--paper);
    border-radius:2px;
    position:relative;
    box-shadow:0 30px 60px rgba(0,0,0,0.45);
    padding:26px 22px 30px;
    overflow:hidden;
  }
  .watermark{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-28deg);
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:120px;
    letter-spacing:.05em;
    color:var(--teal-dark);
    opacity:0.055;
    pointer-events:none;
    user-select:none;
    white-space:nowrap;
    z-index:0;
  }
  .receipt > *:not(.watermark){
    position:relative;
    z-index:1;
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:10px;
    background:
      radial-gradient(circle at 8px 0, transparent 7px, var(--ink) 7px) 0 -4px / 16px 10px repeat-x;
  }
  .receipt::before{ top:-9px; transform:rotate(180deg);}
  .receipt::after{ bottom:-9px; }

  .brand{
    display:block;
    margin:0 auto 10px;
    max-width:170px;
    width:100%;
    height:auto;
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .sub{
    text-align:center;
    font-size:12.5px;
    color:#63665f;
    margin-bottom:20px;
  }
  .dashed{
    border:none;
    border-top:1.5px dashed var(--line);
    margin:18px 0;
  }

  label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--teal-dark);
    margin-bottom:6px;
    margin-top:16px;
  }
  select, input, textarea{
    width:100%;
    padding:11px 12px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  input[name="valor"]{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:18px;
  }
  select:focus, input:focus, textarea:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
    border-color:var(--teal);
  }
  textarea{ resize:vertical; min-height:50px; }

  .scan-block{
    margin-top:18px;
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:14px;
    background:rgba(47,111,94,0.05);
  }
  .scan-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    color:var(--teal-dark);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .scan-buttons{ display:flex; gap:8px; }
  .btn-secondary{
    flex:1;
    padding:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    border-radius:6px;
    border:1.5px solid var(--teal);
    background:#fff;
    color:var(--teal-dark);
    cursor:pointer;
  }
  .btn-secondary:active{ background:var(--paper-dim); }

  #video{
    width:100%;
    border-radius:8px;
    margin-top:10px;
    display:none;
    background:#000;
  }
  #scanStatus{
    font-size:12.5px;
    margin-top:8px;
    min-height:16px;
    color:var(--teal-dark);
  }
  #scanStatus.err{ color:var(--red); }

  .submit{
    width:100%;
    margin-top:26px;
    padding:15px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s;
  }
  .submit:active{ background:var(--teal-dark); }
  .submit:disabled{ background:#9aa39d; cursor:not-allowed; }

  .total-line{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#63665f;
    margin-top:10px;
  }
  #toast{
    position:fixed;
    left:50%; bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:12px 18px;
    border-radius:8px;
    opacity:0;
    transition:all .25s;
    pointer-events:none;
    max-width:90vw;
    text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err{ background:var(--red); }

  .config-note{
    font-size:11px;
    color:#8a8d85;
    text-align:center;
    margin-top:18px;
    font-family:'IBM Plex Mono',monospace;
  }
</style>
</head>

    <input type="number" id="valor" name="valor" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required>

    <label for="categoria">Categoria</label>
    <select id="categoria" name="categoria" required>
      <option value="" disabled selected>Escolhe uma categoria</option>
      <option>Combustível</option>
      <option>Portagens</option>
      <option>Estacionamento</option>
      <option>Ferramentas / Leroy Merlin</option>
      <option>Material / Peças</option>
      <option>Refeição</option>
      <option>Alojamento</option>
      <option>Outro</option>
    </select>

    <label for="descricao">Descrição (opcional)</label>
    <textarea id="descricao" name="descricao" placeholder="Ex: cliente X, nº da fatura, etc."></textarea>

    <button type="submit" class="submit" id="submitBtn">Registar despesa</button>
    <div class="total-line"><span>registos enviados nesta sessão</span><span id="sessionCount">0</span></div>
  </form>

  <div class="config-note">v1.0 · sincroniza com Google Sheets</div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script>
/* ======================================================
   CONFIGURAÇÃO — cola aqui o URL do teu Google Apps Script
   Web App depois de fazeres o deploy (ver instruções enviadas).
   ====================================================== */
const SCRIPT_URL = "COLA_AQUI_O_URL_DO_APPS_SCRIPT";

let sessionCount = 0;

// ---------- Toast ----------
function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  setTimeout(()=>{ t.className=''; }, 3200);
}

// ---------- Verificar suporte do browser ----------
const jsQRReady = typeof jsQR !== 'undefined';
const cameraSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

if(!jsQRReady){
  scanFailed('Não foi possível carregar o leitor de QR code (sem ligação à internet?). Preenche os campos manualmente.');
  document.getElementById('btnCamera').disabled = true;
  document.getElementById('btnUpload').disabled = true;
}

// ---------- Utilitário: reduzir imagens grandes antes de ler o QR ----------
// Fotos de telemóvel modernas (12MP+) podem ultrapassar o limite de canvas
// de alguns browsers (sobretudo Safari/iOS) e tornam a leitura lenta ou
// falhada. Reduzimos sempre para uma largura máxima antes de descodificar.
function drawScaled(source, sourceWidth, sourceHeight, maxDim){
  let w = sourceWidth, h = sourceHeight;
  if(w > maxDim || h > maxDim){
    const ratio = Math.min(maxDim / w, maxDim / h);
    w = Math.round(w * ratio);
    h = Math.round(h * ratio);
  }
  const canvas = document.getElementById('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}

function decodeImageData(imgData, options){
  try{
    return jsQR(imgData.data, imgData.width, imgData.height, options);
  }catch(err){
    return null;
  }
}

// ---------- Data por omissão = hoje ----------
document.getElementById('data').valueAsDate = new Date();

// ---------- Parser do QR code da fatura portuguesa ----------
// Formato: A:...*B:...*F:20260806*...*O:12.50*...
function parseFaturaQR(text){
  const result = {};
  text.split('*').forEach(part=>{
    const idx = part.indexOf(':');
    if(idx === -1) return;
    const key = part.substring(0, idx);
    const val = part.substring(idx+1);
    result[key] = val;
  });
  const out = {};
  if(result['F'] && /^\d{8}$/.test(result['F'])){
    const y = result['F'].substring(0,4), m = result['F'].substring(4,6), d = result['F'].substring(6,8);
    out.data = `${y}-${m}-${d}`;
  }
  if(result['O']){
    const v = parseFloat(result['O'].replace(',','.'));
    if(!isNaN(v)) out.valor = v;
  } else if(result['N']){
    const v = parseFloat(result['N'].replace(',','.'));
    if(!isNaN(v)) out.valor = v;
  }
  return (out.data || out.valor) ? out : null;
}

function applyScan(parsed){
  if(parsed.data) document.getElementById('data').value = parsed.data;
  if(parsed.valor) document.getElementById('valor').value = parsed.valor.toFixed(2);
  const el = document.getElementById('scanStatus');
  el.className = '';
  el.textContent = '✓ Dados lidos do QR code — confirma antes de enviar.';
  toast('QR code lido com sucesso');
}

function scanFailed(msgOverride){
  const el = document.getElementById('scanStatus');
  el.className = 'err';
  el.textContent = msgOverride || 'Não foi possível ler o QR code. Preenche os campos manualmente.';
}

// ---------- Ler QR a partir de ficheiro/foto ----------
document.getElementById('btnUpload').addEventListener('click', ()=>{
  if(!jsQRReady) return;
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = ()=>{
    // até 2000px de lado maior — mais do que suficiente para ler o QR
    // e evita falhas de canvas em imagens muito grandes no Safari/iOS
    const imgData = drawScaled(img, img.naturalWidth, img.naturalHeight, 2000);
    const code = decodeImageData(imgData, { inversionAttempts: 'attemptBoth' });
    if(code){
      const parsed = parseFaturaQR(code.data);
      if(parsed) applyScan(parsed);
      else scanFailed('QR code lido, mas não é uma fatura reconhecida. Preenche manualmente.');
    } else {
      scanFailed();
    }
    URL.revokeObjectURL(img.src);
  };
  img.onerror = ()=>{
    scanFailed('Não foi possível abrir esta imagem. Tenta outra foto.');
  };
  img.src = URL.createObjectURL(file);
  // permite escolher a mesma foto outra vez sem o browser ignorar o evento
  e.target.value = '';
});

// ---------- Ler QR ao vivo pela câmara ----------
let stream = null, scanning = false;
const video = document.getElementById('video');
const btnCamera = document.getElementById('btnCamera');
video.muted = true;
video.playsInline = true;

if(!cameraSupported){
  btnCamera.disabled = true;
}

btnCamera.addEventListener('click', async ()=>{
  if(!jsQRReady) return;
  if(scanning){ stopCamera(); return; }
  if(!cameraSupported){
    scanFailed('Este browser não permite aceder à câmara aqui. Usa "Escolher foto" em alternativa.');
    return;
  }
  const constraintsList = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: true }
  ];
  let lastErr = null;
  for(const constraints of constraintsList){
    try{
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      lastErr = null;
      break;
    }catch(err){
      lastErr = err;
    }
  }
  if(lastErr){
    if(lastErr.name === 'NotAllowedError'){
      scanFailed('Permissão da câmara negada. Autoriza o acesso nas definições do browser.');
    }else{
      scanFailed('Sem acesso à câmara. Usa "Escolher foto" em alternativa.');
    }
    return;
  }
  try{
    video.srcObject = stream;
    video.style.display = 'block';
    await video.play();
    scanning = true;
    btnCamera.textContent = '✕ Fechar câmara';
    requestAnimationFrame(tickCamera);
  }catch(err){
    scanFailed('Não foi possível iniciar a câmara. Usa "Escolher foto" em alternativa.');
    stopCamera();
  }
});

function stopCamera(){
  scanning = false;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  video.srcObject = null;
  video.style.display = 'none';
  btnCamera.textContent = '📷 Abrir câmara';
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && scanning) stopCamera();
});

function tickCamera(){
  if(!scanning) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0){
    const imgData = drawScaled(video, video.videoWidth, video.videoHeight, 900);
    const code = decodeImageData(imgData, { inversionAttempts: 'attemptBoth' });
    if(code){
      const parsed = parseFaturaQR(code.data);
      if(parsed){
        applyScan(parsed);
        stopCamera();
        return;
      }
    }
  }
  requestAnimationFrame(tickCamera);
}

// ---------- Submeter ----------
document.getElementById('expenseForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(SCRIPT_URL.includes('COLA_AQUI')){
    toast('Falta configurar o URL do Google Apps Script no código.', true);
    return;
  }
  const btn = document.getElementById('submitBtn');
  const payload = {
    tecnico: document.getElementById('tecnico').value,
    data: document.getElementById('data').value,
    valor: parseFloat(document.getElementById('valor').value),
    categoria: document.getElementById('categoria').value,
    descricao: document.getElementById('descricao').value
  };
  btn.disabled = true;
  btn.textContent = 'A enviar...';
  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    sessionCount++;
    document.getElementById('sessionCount').textContent = sessionCount;
    toast(`Despesa registada — ${payload.tecnico}`);
    document.getElementById('expenseForm').reset();
    document.getElementById('data').valueAsDate = new Date();
    document.getElementById('scanStatus').textContent = '';
    stopCamera();
  }catch(err){
    toast('Erro ao enviar. Verifica a ligação e tenta novamente.', true);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Registar despesa';
  }
});
</script>
</body>
</html>
